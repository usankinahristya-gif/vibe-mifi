<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 id="event-title">Ночь в музее</h1>
    <p class="event-date">15 ноября, 18:30</p>
    <p class="event-place">Музей космонавтики, проспект Мира, 111</p>
    <p class="event-description">Вечерняя программа с выставкой и экскурсиями</p>

    <button id="show-program" type="button">Показать программу</button>
    <div id="program" hidden></div>

    <form id="service-form">
      <label>
        <input type="checkbox" id="guide" name="service" value="guide">
        Экскурсия с гидом
      </label>
      <label>
        <input type="checkbox" id="audio" name="service" value="audio">
        Аудиогид
      </label>
      <label>
        <input type="checkbox" id="catalog" name="service" value="catalog">
        Каталог выставки
      </label>
      <button type="submit">Рассчитать</button>
    </form>

    <p id="choice-error" hidden>Выберите хотя бы одну услугу.</p>
    <p id="data-error" hidden>Ошибка данных.</p>

    <div id="result" hidden></div>
    <p id="report-json" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
